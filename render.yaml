services:
  - type: web
    name: private-reservations
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_TIME_ZONE
        value: America/Mexico_City
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: ADMIN_EMAIL
        sync: false
      - key: MEMBER_EMAIL
        sync: false
